[package]
name = "afreum-mini-redeem"
version = "0.1.0"
edition = "2021"
description = "Soroban smart contract to mint and redeem Afreum fiat-backed tokens on Stellar."
license = "Apache-2.0"
repository = "https://github.com/AfreumToolkits/Mini_Redeem_-Sorobon"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "21.7.0"

[dev-dependencies]
soroban-sdk = { version = "21.7.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[workspace]